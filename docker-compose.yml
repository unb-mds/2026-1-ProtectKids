services:
  db:
    container_name: ProtectKids_db
    image: postgres:15
    # APAGAMOS O 'environment' E COLOCAMOS O 'env_file'
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    container_name: ProtectKids_backend
    image: ghcr.io/unb-mds/2026-1-protectkids-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    # O BACKEND TAMBÉM VAI LER AS SENHAS DO ARQUIVO .ENV
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: ProtectKids_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data: