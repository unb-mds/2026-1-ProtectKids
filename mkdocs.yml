site_name: ProtectKids
site_url: https://unb-mds.github.io/2026-1-ProtectKids/

nav:
  - Início: index.md
  - Visão Geral: visao-geral.md
  - Requisitos: requisitos.md
  - Arquitetura: arquitetura.md
  - Contribuição: contribuicao.md

theme:
  name: material
  
  palette:
    - scheme: slate  # Isso garante o fundo escuro
      primary: custom # Isso avisa para usar a cor do extra.css
      accent: custom
      
 
    
  features:
    - navigation.tabs # Isso é o que cria a barra superior horizontal!
    - navigation.top
    - toc.integrate

markdown_extensions:
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css