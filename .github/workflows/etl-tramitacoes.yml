name: Atualização de Tramitações (ETL)

on:
  schedule:
    # 0 6 * * 0,3 significa: 06:00 UTC (03:00 no horário de Brasília) aos Domingos (0) e Quartas (3)
    - cron: '0 6 1,15 * *'
  
  # Este comando permite que você clique num botão no GitHub para rodar manualmente a qualquer momento
  workflow_dispatch: 

jobs:
  atualizar-banco:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Rodar Crawler de Tramitações
        env:
          # A esteira precisa das credenciais do banco de produção para salvar os dados
          DATABASE_URL: ${{ secrets.DATABASE_URL }} 
        run: |
          cd backend
          python -m crawler.tramitacoes_api