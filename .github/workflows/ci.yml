name: ProtectKids CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend - Pytest
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./test_ci.db
      DEBUG_SQL: "false"
      CORS_ORIGINS: http://localhost:5173
      SPACY_MODEL: pt_core_news_sm

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes do backend com cobertura mínima
        working-directory: backend
        run: |
          pytest tests/ --cov=main --cov=models --cov=database --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70

  frontend:
    name: Frontend - Lint, Test e Build
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://localhost:8000

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Rodar lint
        working-directory: frontend
        run: npm run lint

      - name: Rodar testes
        working-directory: frontend
        run: npm test -- --run

      - name: Rodar cobertura do frontend
        working-directory: frontend
        run: npm run test:coverage

      - name: Rodar build
        working-directory: frontend
        run: npm run build